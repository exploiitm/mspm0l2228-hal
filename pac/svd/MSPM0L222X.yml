_svd: "./MSPM0L222X.svd"

_delete:
  - ADC0
  - ADC0_SVT
  - VREF
  - TIMG0
  - TIMG4
  - TIMG5
  - TIMG8
  - TIMG12
  - I2C1
  - I2C2
  - LCD
  - UART2
  - UART3
  - UART4
  - COMP0
  - SPI0
  - SPI1
  - LFSS
  - TIMA0
  - WUC

_add:
  FACTORYREGION:
    baseAddress: 0x41C40000
    addressBlock:
      offset: 0x0
      size: 0x80
      usage: registers
    registers:
      TRACEID:
        addressOffset: 0x0
        size: 32
        access: read-only
        description: "Unique value per device shipped"
      DEVICEID:
        addressOffset: 0x4
        size: 32
        access: read-only
        description: "Device Identifier"
        fields:
          MANAFACTURER:
            description: "TI's JEDEC bank and company code"
            bitOffset: 1
            bitWidth: 11
            resetValue: 0x17
          PARTNUM:
            description: "Part number of the device"
            bitOffset: 12
            bitWidth: 16
            resetValue: 0xBB88
          VERSION:
            description: "Revision of this device"
            bitOffset: 28
            bitWidth: 4
            resetValue: 0x0
      USERID:
        addressOffset: 0x8
        size: 32
        access: read-only
        description: "User ID"
        fields:
          PART:
            description: "Bit pattern that uniquely identifying a part"
            bitOffset: 0
            bitWidth: 16
            resetValue: 0
          VARIANT:
            description: "Bit pattern uniquely identifying the variant for the part"
            bitOffset: 16
            bitWidth: 8
            resetValue: 0
          MINORREV:
            description: "Monotonic increasing value indicating a new revision of the SKU that preserves compatability with lesser minor rev values. New capability may be introduced such that lesser minor rev numbers may not be compatible with greater if the new capability is used."
            bitOffset: 24
            bitWidth: 4
            resetValue: 0
          MAJORREV:
            description: "Monotonic increasing value indiciating a new revision of the SKU significant enough that users of the device may have tro revise PCB or software design"
            bitOffset: 28
            bitWidth: 3
            resetValue: 0
      SRAMFLASH:
        addressOffset: 0x18
        size: 32
        access: read-only
        description: "SRAM flash"
        fields:
          MAINFLASH_SZ:
            description: |
              The encoding of the field is that value of the field is an interger to be interpreted as number of KB.
              For example, if the value of the field id 4, then it is 4KB, the value is 32KB, and so on.
            bitOffset: 0
            bitWidth: 11
            resetValue: 0x80
          MAINNUMBANKS:
            bitOffset: 12
            bitWidth: 2
          SRAM_SZ:
            description: |
              The encoding of the field is that the value of the field is an integer to be interpreted as number of KB.
              For example id 4, then it is 4KB, if the value is 32, then 32KB, and so on.
            bitOffset: 16
            bitWidth: 10
            resetValue: 0x20
          DATAFLASH_SZ:
            description: |
              The encoding of the field is that the value of the field is an integer to be interpreted as number of KB.
              For example id 4, then it is 4KB, if the value is 32, then 32KB, and so on.
            bitOffset: 26
            bitWidth: 6
            resetValue: 0x0



# The CTR_WIDTH field in the AESADV_CTRL register has different uses depending
# on whether the CTR or CFB fields are set. The SVD file does not handle all
# of the cases for CFB mode and also added duplicate enumerated values.
# This is resolved by combining the CTR_WIDTH enumerated value definitions.
#
# The OFB_GCM_CCM_CONT field also has a dual use depending on whether
# OFB mode or CCM/GCM mode is selected.
AESADV:
  AESADV_CTRL:
    _delete:
      - CTR_WIDTH
      - OFB_GCM_CCM_CONT
    _add:
      CTR_WIDTH:
        description: |
          When the CTR bit is set, specifies the counter width for AES-CTR mode.
          When the CFB bit is set, specifies the CFB mode feedback width:
        bitOffset: 7
        bitWidth: 2
        access: read-write
      OFB_GCM_CCM_CONT:
        description: |
          This bit has a dual use, depending on the selection of CCM/GCM, see bits [18:16].
          If CCM/GCM is not selected:
          If this bit is set to 1b, full block AES output feedback mode (OFB-128) is selected.
          If CCM/GCM is selected:
          Continue processing of an interrupted AES-GCM or AES-CCM operation in the AAD phase.
          Set this write-only signal to 1b together with the regular mode bit settings for a GCM or CCM operation, to continue processing from the next full AAD block (128 bits) boundary.
          Before setting this bit all applicable context to resume processing must have been loaded into the engine: Keys, IV, intermediate digest/TAG, block counter and the CCM align data word (the latter is for CCM mode only). The mode can be written together with this bit, as it is part of the same register.
        bitOffset: 26
        bitWidth: 1
        access: read-write
    CTR_WIDTH:
      _write:
        CTR32_OR_CFB128: [0x0, "CTR: 32-bit counter; CFB: CFB-128 mode"]
        CTR64_OR_CFB1: [0x1, "CTR: 64-bit counter; CFB: CFB-1 mode"]
        CTR96_OR_CFB8: [0x2, "CTR: 96-bit counter; CFB: CFB-8 mode"]
        CTR128: [0x3, "CTR: 128-bit counter; CFB: undefined"]
    OFB_GCM_CCM_CONT:
      _write:
        OFB_OR_GCM_CCM_CONT: [0x1, "OFB: Enable OFB; CCM/GCM: Continue GCM/CCM processing in AAD phase"]
  "AESADV_GPRCM\\[%s\\]":
    AESADV_PWREN:
      _add:
        KEY_UNLOCK:
          description: "Key unlock for AESADV power enable"
          bitOffset: 24
          bitWidth: 8
      KEY_UNLOCK:
        LOCK: [0x0, "Lock pwren"]
        UNLOCK: [0x26, "Unlock pwren"]

    AESADV_RSTCTL:
      _add:
        KEY_UNLOCK:
          description: "Key unlock for AESADV reset control"
          bitOffset: 24
          bitWidth: 8
      KEY_UNLOCK:
        _write:
          LOCK: [0x0, "Lock reset"]
          UNLOCK: [0xB1, "Unlock reset"]
  _add:
    _interrupts:
      AESADV:
        value: 28

